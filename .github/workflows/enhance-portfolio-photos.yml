name: Enhance portfolio photos

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/enhance-portfolio-photos.yml"

permissions:
  contents: write

jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install Pillow
      - name: Upscale and refine portfolio images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter
          folder = Path("images")
          names = [
              "cnc-gantry.jpg", "plasma-welding.jpg",
              "profile-projector.jpg", "spot-welding.jpg",
              "training-line.jpg", "concept-dashboard.jpg",
              "concept-digital-twin.jpg"
          ]
          for name in names:
              src = folder / name
              if not src.exists():
                  continue
              with Image.open(src) as im:
                  im = im.convert("RGB")
                  w, h = im.size
                  target_w = min(max(w * 2, 1600), 2800)
                  target_h = round(h * target_w / w)
                  im = im.resize((target_w, target_h), Image.Resampling.LANCZOS)
                  im = ImageEnhance.Contrast(im).enhance(1.035)
                  im = ImageEnhance.Color(im).enhance(1.025)
                  im = im.filter(ImageFilter.UnsharpMask(radius=1.35, percent=125, threshold=3))
                  out = folder / (src.stem + "-hd.jpg")
                  im.save(out, "JPEG", quality=94, optimize=True, progressive=True, subsampling=0)
                  print(f"{name}: {w}x{h} -> {target_w}x{target_h}")
          PY
      - name: Commit enhanced images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*-hd.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add enhanced HD portfolio photos"
            git push
          fi
