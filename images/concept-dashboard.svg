    <rect x="70" y="647" width="330" height="64" rx="10" fill="#eef6ff" stroke="#b8cce0"/>
    <text x="235" y="673" fill="#36506b" font-size="16" font-weight="700">CNC Machine 1</text><text x="235" y="695" fill="#68798b" font-size="13">Machine data + status</text>
    <text x="413" y="686" fill="#8893a1" font-size="25">→</text>
    <rect x="430" y="647" width="330" height="64" rx="10" fill="#f1f4f8" stroke="#d7dee8"/>
    <text x="595" y="673" fill="#3f4a58" font-size="16" font-weight="700">IoT / Machine Interface</text><text x="595" y="695" fill="#68798b" font-size="13">Collects real-time data</text>
    <text x="773" y="686" fill="#8893a1" font-size="25">→</text>
    <rect x="790" y="647" width="330" height="64" rx="10" fill="#111a2b" stroke="#111a2b"/>
    <text x="955" y="673" fill="#fff" font-size="16" font-weight="700">Cloud / Local Server</text><text x="955" y="695" fill="#b9c3d0" font-size="13">Processes + optimises schedule</text>
    <text x="1133" y="686" fill="#8893a1" font-size="25">→</text>
    <rect x="1150" y="647" width="380" height="64" rx="10" fill="#eef6ff" stroke="#b8cce0"/>
    <text x="1340" y="673" fill="#36506b" font-size="16" font-weight="700">Dashboard + Mobile App</text><text x="1340" y="695" fill="#68798b" font-size="13">Web, desktop + notifications</text>
  </g>
  <text x="70" y="744" fill="#76818e" font-family="Arial, Helvetica, sans-serif" font-size="13">CNC Machines 2 &amp; 3 feed the same interface in parallel, giving one unified schedule across the shop floor.</text>

  <rect x="52" y="793" width="1496" height="290" rx="18" fill="#fff" stroke="#d7dee8" stroke-width="2"/>
  <circle cx="75" cy="823" r="6" fill="#28a6bd"/>
  <text x="91" y="829" fill="#334252" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1">TECHNICIAN ALERT</text>
