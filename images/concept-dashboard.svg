    <rect x="434" y="244" width="354" height="64" rx="9" fill="#fbfcfe" stroke="#d9e0e9"/>
    <rect x="798" y="244" width="354" height="64" rx="9" fill="#fbfcfe" stroke="#d9e0e9"/>
    <rect x="1162" y="244" width="368" height="64" rx="9" fill="#fbfcfe" stroke="#d9e0e9"/>
