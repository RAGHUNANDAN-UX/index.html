  <text x="316" y="829" fill="#334252" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1">KEY FEATURES</text>
  <g fill="#364454" font-family="Arial, Helvetica, sans-serif" font-size="15">
    <circle cx="304" cy="867" r="4" fill="#38a66a"/><text x="320" y="872">Automatic tool-change scheduling</text>
    <circle cx="304" cy="906" r="4" fill="#38a66a"/><text x="320" y="911">Optimised job sequencing by deadline and availability</text>
    <circle cx="304" cy="945" r="4" fill="#38a66a"/><text x="320" y="950">Real-time machine monitoring</text>
    <circle cx="304" cy="984" r="4" fill="#38a66a"/><text x="320" y="989">Mobile alerts for technicians</text>
    <circle cx="304" cy="1023" r="4" fill="#38a66a"/><text x="320" y="1028">Integration with CAD/CAM and machine controllers</text>
  </g>

  <circle cx="940" cy="823" r="6" fill="#d9a334"/>
  <text x="956" y="829" fill="#334252" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1">KEY BENEFITS</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#364454">
    <circle cx="950" cy="867" r="9" fill="#e4f6ed"/><text x="950" y="871" fill="#319562" font-size="12" font-weight="700" text-anchor="middle">✓</text><text x="969" y="872">Reduces cost — less downtime, better utilisation</text>
    <circle cx="950" cy="902" r="9" fill="#e4f6ed"/><text x="950" y="906" fill="#319562" font-size="12" font-weight="700" text-anchor="middle">✓</text><text x="969" y="907">Saves time — faster job turnaround</text>
    <circle cx="950" cy="937" r="9" fill="#e4f6ed"/><text x="950" y="941" fill="#319562" font-size="12" font-weight="700" text-anchor="middle">✓</text><text x="969" y="942">Improves usability — easy to manage and track</text>
