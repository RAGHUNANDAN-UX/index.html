<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120">
  <title>Real-time production scheduling dashboard concept</title>
  <desc>A crisp dashboard concept showing CNC job status, machine utilisation, upcoming tool changes, system flow, technician alerts, features and benefits.</desc>
  <rect width="1600" height="1120" fill="#f3f5fa"/>
  <text x="54" y="46" fill="#376a9c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">CONCEPT SKETCH · PROTOTYPE IDEA</text>
  <text x="54" y="88" fill="#182235" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Real-Time Production Scheduling Dashboard for CNC Machines</text>
  <text x="54" y="119" fill="#5e6876" font-family="Arial, Helvetica, sans-serif" font-size="17">An intelligent system integrates with CNC controllers to schedule tool changes, optimise utilisation and reduce downtime.</text>

  <rect x="52" y="148" width="1496" height="425" rx="18" fill="#fff" stroke="#d7dee8" stroke-width="2"/>
  <circle cx="75" cy="177" r="6" fill="#3972b7"/>
