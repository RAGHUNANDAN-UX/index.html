  <text x="88" y="515" fill="#45515f" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">MACHINE UTILISATION</text>
  <circle cx="126" cy="544" r="22" fill="#fff" stroke="#dfe5ec"/>
  <text x="126" y="550" fill="#263546" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">78%</text>
  <circle cx="164" cy="533" r="4" fill="#45ad74"/><text x="176" y="538" fill="#687381" font-family="Arial, Helvetica, sans-serif" font-size="12">Running — 78%</text>
  <circle cx="164" cy="548" r="4" fill="#dca53b"/><text x="176" y="553" fill="#687381" font-family="Arial, Helvetica, sans-serif" font-size="12">Idle — 12%</text>
  <circle cx="164" cy="563" r="4" fill="#c6ced8"/><text x="176" y="568" fill="#687381" font-family="Arial, Helvetica, sans-serif" font-size="12">Maintenance — 10%</text>
  <text x="660" y="515" fill="#45515f" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">UPCOMING TOOL CHANGE</text>
