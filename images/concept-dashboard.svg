    <text x="88" y="402">CNC-02</text><text x="385" y="402">Part B-204</text><text x="685" y="402">T05</text><text x="1390" y="402">3h 40m</text>
    <text x="88" y="437">CNC-03</text><text x="385" y="437">Part C-317</text><text x="685" y="437">T08</text><text x="1390" y="437">5m</text>
