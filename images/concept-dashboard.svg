    <text x="452" y="272" fill="#182235" font-size="25" font-weight="700">5</text>
    <text x="452" y="293" fill="#6b7582" font-size="12" letter-spacing="1">IN PROGRESS</text>
    <text x="816" y="272" fill="#349a63" font-size="25" font-weight="700">6</text>
    <text x="816" y="293" fill="#6b7582" font-size="12" letter-spacing="1">COMPLETED</text>
    <text x="1180" y="272" fill="#bd8730" font-size="25" font-weight="700">1</text>
    <text x="1180" y="293" fill="#6b7582" font-size="12" letter-spacing="1">PENDING</text>
  </g>

