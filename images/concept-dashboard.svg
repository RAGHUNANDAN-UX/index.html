  <text x="676" y="557" fill="#806b58" font-family="Arial, Helvetica, sans-serif" font-size="12">Current tool T08 → Next tool T12 — notify technician in 5 min</text>

  <rect x="52" y="594" width="1496" height="178" rx="18" fill="#fff" stroke="#d7dee8" stroke-width="2"/>
  <circle cx="75" cy="622" r="6" fill="#8253bd"/>
  <text x="91" y="628" fill="#334252" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1">SYSTEM FLOW</text>
