  <circle cx="89" cy="215" r="5" fill="#fff"/>
  <text x="104" y="221" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="15">GTTC Production Dashboard</text>
  <circle cx="1478" cy="215" r="5" fill="#fff"/>
  <text x="1493" y="221" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end">System Online</text>

